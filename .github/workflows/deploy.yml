name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare deployment folder
        run: |
          # Create a temporary folder to hold everything we want to deploy
          mkdir -p _site
          # Copy the public folder contents (includes index.html)
          cp -r public/* _site/
          # Copy the root assets folder into the _site folder
          cp -r assets _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'  # Deploy this combined folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
