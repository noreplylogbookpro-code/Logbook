<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30;url=/" />
    <title>404 - Access Restricted</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --blue: #3b82f6;
            --purple: #a855f7;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }
        .glow-blue {
            background: var(--blue);
            top: -10%;
            left: -10%;
        }
        .glow-purple {
            background: var(--purple);
            bottom: -10%;
            right: -10%;
        }
        .container {
            position: relative;
            z-index: 10;
            max-width: 480px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(to right, var(--blue), var(--purple));
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.3);
            text-align: center;
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body>
    <div class="glow glow-blue"></div>
    <div class="glow glow-purple"></div>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Restricted Access</h1>
        <p>Unauthorized Access Path. Direct administration console access is blocked. Please route through an authorized supervisor or team member to access master resources.</p>
        <a href="/" class="btn" id="redirect-btn">Return to Homepage (30)</a>
    </div>
    <script>
        let seconds = 30;
        const btn = document.getElementById('redirect-btn');
        const interval = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/';
            } else {
                btn.textContent = `Return to Homepage (${seconds})`;
            }
        }, 1000);
    </script>
</body>
</html>
