<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30;url=/" />
    <title>404 - Page Not Found | Logbook Plus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #121215;
            --border: #27272a;
            --border-hover: #3f3f46;
            --text-primary: #fafafa;
            --text-muted: #a1a1aa;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container {
            max-width: 460px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .error-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            letter-spacing: -0.04em;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }
        p {
            color: var(--text-muted);
            font-size: 0.875rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            color: #09090b;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #fafafa;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            text-align: center;
        }
        .btn:hover {
            background: #e4e4e7;
            border-color: #e4e4e7;
        }
        .meta {
            margin-top: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Endpoint Not Found</h1>
        <p>The requested route does not exist or has been relocated to an authorized administrative portal.</p>
        <a href="/" class="btn">Return to Homepage</a>
        <div class="meta">Automated redirect in 30 seconds</div>
    </div>
</body>
</html>
